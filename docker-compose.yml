version: '3.7'

services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    container_name: prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "9092:3000"
    container_name: grafana
    depends_on:
      - prometheus

volumes:
  jenkins_home:
